<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamLab Explorar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <h1 id="heading">Explorar</h1>
      <p class="sub" id="subheading">Transmisiones en vivo y canales de toda la comunidad</p>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const tab = params.get('tab');
    let category = params.get('category') || '';

    async function load() {
      const grid = document.getElementById('grid');
      let list;
      if (tab === 'following') {
        list = await api('/api/following').catch(() => []);
      } else {
        list = await api('/api/channels' + (category ? '?category=' + encodeURIComponent(category) : ''));
      }
      grid.innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="empty">No hay canales aquí todavía.</div>';
    }

    renderSidebar(document.getElementById('sidebar'));

    async function loadChips() {
      if (tab === 'following') return;
      const cats = await api('/api/categories');
      const chips = document.getElementById('chips');
      chips.innerHTML = `
        <span class="chip ${!category ? 'active' : ''}" data-c="">Todo</span>
        ${cats.map((c) => `<span class="chip ${category === c.name ? 'active' : ''}" data-c="${esc(c.name)}">${esc(c.name)}<small>${c.live ? c.live + ' en vivo' : ''}</small></span>`).join('')}
      `;
      chips.onclick = (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        category = chip.dataset.c;
        history.replaceState(null, '', category ? '/?category=' + encodeURIComponent(category) : '/');
        loadChips();
        load();
      };
    }

    (async () => {
      await renderTopbar(tab === 'following' ? 'following' : 'home');
      if (tab === 'following') {
        document.getElementById('heading').textContent = 'Siguiendo';
        document.getElementById('subheading').textContent = 'Los canales que sigues';
      }
      loadChips();
      load();
      io().on('live', () => { loadChips(); load(); });
    })();
  </script>
</body>
</html>
